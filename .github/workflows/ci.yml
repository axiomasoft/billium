name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      SKM_WORKSPACES: ${{ github.workspace }}/workspaces
    defaults:
      run:
        working-directory: billium
    steps:
      - uses: actions/checkout@v7
        with:
          path: billium
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/packman
          path: packman
          token: ${{ secrets.SKM_WORKSPACE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: academici/swissknifeman-axioma-workspace
          path: workspaces/axioma
          token: ${{ secrets.SKM_WORKSPACE_TOKEN }}
          persist-credentials: false
      - run: docker compose build toolchain
      - run: docker compose run --rm toolchain composer install --no-interaction --prefer-dist
      - run: docker compose run --rm toolchain bash scripts/ci.sh
