name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      SKM_WORKSPACES: ${{ github.workspace }}/workspaces
    defaults:
      run:
        working-directory: billium
    steps:
      - uses: actions/checkout@v7
        with:
          path: billium
      - uses: actions/checkout@v7
        with:
          repository: axiomasoft/packman
          ref: v0.1.1
          path: packman
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: academici/swissknifeman-axioma-workspace
          path: workspaces/axioma
          token: ${{ secrets.WORKSPACE_READ }}
          persist-credentials: false
      - name: Match toolchain user to the checkout owner
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose build toolchain
      - run: docker compose run --rm toolchain composer install --no-interaction --prefer-dist
      - run: docker compose run --rm toolchain bash scripts/ci.sh
