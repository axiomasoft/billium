name: ci

# One pipeline as a job graph: `changes` selects the affected layers from tests/zones.json,
# quality checks and tests then fan out in parallel, and `CI gate` is the single required check.
# Every job runs one `scripts/ci.sh --step` or `--layer`, so the gate composition stays in ci.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every commit on main keeps its own verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PACKMAN_REPOSITORY: axiomasoft/packman
  PACKMAN_REF: v0.1.1
  PG_SHARDS: 8

defaults:
  run:
    shell: bash
    working-directory: billium

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lint: ${{ steps.layers.outputs.lint }}
      derived: ${{ steps.layers.outputs.derived }}
      php: ${{ steps.layers.outputs.php }}
      dart: ${{ steps.layers.outputs.dart }}
      conformance: ${{ steps.layers.outputs.conformance }}
      toolchain: ${{ steps.layers.outputs.toolchain }}
      coverage: ${{ steps.layers.outputs.coverage }}
      shards: ${{ steps.layers.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          fetch-depth: 0
          persist-credentials: false
      - name: Select layers
        id: layers
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          all=(lint derived php dart conformance)
          if [[ "$EVENT" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            selected=("${all[@]}")
            toolchain=true
          else
            mapfile -t selected < <(bash scripts/ci.sh --affected "$BASE...$HEAD")
            toolchain=false
            if git diff --name-only "$BASE...$HEAD" -- docker compose.yaml | grep -q .; then
              toolchain=true
            fi
          fi
          for layer in "${all[@]}"; do
            hit=false
            [[ " ${selected[*]} " == *" $layer "* ]] && hit=true
            echo "$layer=$hit" >> "$GITHUB_OUTPUT"
          done
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          # Coverage roughly doubles test time, so pull requests skip it; main and manual runs collect it.
          coverage=true
          [[ "$EVENT" == pull_request ]] && coverage=false
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          shards="$(seq -s, 1 "$PG_SHARDS")"
          echo "shards=[$shards]" >> "$GITHUB_OUTPUT"
          {
            echo "### Selected layers"
            echo "${selected[*]:-none} (toolchain image: $toolchain, coverage: $coverage)"
          } >> "$GITHUB_STEP_SUMMARY"

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: billium
          advanced-security: false
          persona: regular

  lint:
    name: Layer lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          php-version: ""
          python: "true"
      - run: bash scripts/ci.sh --layer lint

  derived:
    name: Layer derived
    needs: changes
    if: needs.changes.outputs.derived == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          php-version: ""
          python: "true"
      - run: bash scripts/ci.sh --layer derived

  analyse:
    name: Analyse ${{ matrix.step }}
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        step: [php-validate, php-phpstan]
    # Tests wait only for these two: an invalid manifest or a type error makes test results moot.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python: ${{ matrix.step == 'php-contracts' }}
      - name: Restore the analysis cache
        if: matrix.step != 'php-validate' && matrix.step != 'php-contracts'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Result caches only skip unchanged files; each tool invalidates them on config or dependency changes.
          path: |
            billium/build/phpstan
            billium/build/rector
            billium/build/pint.cache
          key: ${{ matrix.step }}-${{ hashFiles('billium/composer.lock') }}-${{ github.sha }}
          restore-keys: ${{ matrix.step }}-${{ hashFiles('billium/composer.lock') }}-
      - run: bash scripts/ci.sh --step "$STEP"
        env:
          STEP: ${{ matrix.step }}

  quality:
    name: Quality ${{ matrix.step }}
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        step: [php-pint, php-rector, php-contracts]
    # Style, refactoring and contract drift do not block the test jobs; they only gate the merge.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python: ${{ matrix.step == 'php-contracts' }}
      - name: Restore the analysis cache
        if: matrix.step != 'php-validate' && matrix.step != 'php-contracts'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Result caches only skip unchanged files; each tool invalidates them on config or dependency changes.
          path: |
            billium/build/phpstan
            billium/build/rector
            billium/build/pint.cache
          key: ${{ matrix.step }}-${{ hashFiles('billium/composer.lock') }}-${{ github.sha }}
          restore-keys: ${{ matrix.step }}-${{ hashFiles('billium/composer.lock') }}-
      - run: bash scripts/ci.sh --step "$STEP"
        env:
          STEP: ${{ matrix.step }}

  php-unit:
    name: Unit PHP ${{ matrix.php }} (SQLite)
    needs: [changes, analyse]
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    env:
      BILLIUM_TEST_REPORTS: build/reports
      BILLIUM_TEST_COVERAGE: ${{ matrix.php == '8.4' && needs.changes.outputs.coverage == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ env.BILLIUM_TEST_COVERAGE == '1' && 'pcov' || 'none' }}
      - run: bash scripts/ci.sh --step php-unit
      - name: Summarise tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test-report.py build/reports >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && matrix.php == '8.4' }}
        with:
          name: reports-unit
          path: billium/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  php-pg:
    name: PostgreSQL shard ${{ matrix.shard }}
    needs: [changes, analyse]
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    env:
      BILLIUM_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      BILLIUM_TEST_REPORTS: build/reports
      BILLIUM_TEST_COVERAGE: ${{ needs.changes.outputs.coverage == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          coverage: ${{ env.BILLIUM_TEST_COVERAGE == '1' && 'pcov' || 'none' }}
          postgres: "true"
      - run: bash scripts/ci.sh --step php-pg
      - name: Summarise tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test-report.py build/reports >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports-pg-${{ matrix.shard }}
          path: billium/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  php-pg-serial:
    name: PostgreSQL serial
    needs: [changes, analyse]
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BILLIUM_TEST_REPORTS: build/reports
      BILLIUM_TEST_COVERAGE: ${{ needs.changes.outputs.coverage == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          coverage: ${{ env.BILLIUM_TEST_COVERAGE == '1' && 'pcov' || 'none' }}
          postgres: "true"
      - run: bash scripts/ci.sh --step php-pg-serial
      - name: Summarise tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test-report.py build/reports >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports-pg-serial
          path: billium/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  php-smoke:
    name: Smoke ${{ matrix.step }}
    needs: [changes, analyse]
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        step: [php-smoke-consumer, php-smoke-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python: "true"
          postgres: "true"
      - run: bash scripts/ci.sh --step "$STEP"
        env:
          STEP: ${{ matrix.step }}

  dart:
    name: Layer dart
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python: "true"
          dart: "true"
      - run: bash scripts/ci.sh --layer dart

  conformance:
    name: Conformance ${{ matrix.step }}
    needs: [changes, analyse]
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        step: [conformance-vectors, conformance-server, conformance-integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python: "true"
          dart: "true"
          postgres: "true"
      - run: bash scripts/ci.sh --step "$STEP"
        env:
          STEP: ${{ matrix.step }}

  toolchain:
    name: Toolchain image
    needs: changes
    if: needs.changes.outputs.toolchain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: billium/docker/toolchain
          tags: billium-toolchain:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the image
        run: |
          # The local gate runs inside this image; prove its tools start and ci.sh loads.
          docker run --rm -v "$PWD:/workspace" -w /workspace billium-toolchain:local \
            bash -c 'php -v && composer --version && dart --version && python3 --version && psql --version && bash scripts/ci.sh --list'

  report:
    name: Test report
    needs: [changes, php-unit, php-pg, php-pg-serial]
    if: ${{ !cancelled() && needs.changes.outputs.php == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billium
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-*
          path: billium/build/reports
          merge-multiple: true
      - name: Summarise all test jobs
        run: |
          {
            echo "## Tests"
            python3 scripts/ci/test-report.py --slowest 20 build/reports
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up PHP for the coverage merge
        if: needs.changes.outputs.coverage == 'true'
        uses: $/.github/actions/setup
      - name: Merge coverage
        if: needs.changes.outputs.coverage == 'true'
        run: |
          shopt -s nullglob
          files=(build/reports/*.cov)
          if ((${#files[@]} == 0)); then
            echo "::error::no coverage files were uploaded by the test jobs"
            exit 1
          fi
          {
            echo "## Coverage"
            php -d memory_limit=2G scripts/ci/merge-coverage.php build/coverage "${files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.coverage == 'true'
        with:
          name: coverage
          path: billium/build/coverage/
          retention-days: 14

  gate:
    name: CI gate
    needs: [changes, workflows, lint, derived, analyse, quality, php-unit, php-pg, php-pg-serial, php-smoke, dart, conformance, toolchain, report]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every selected job to pass
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # Skipped jobs are layers the change does not touch; anything else but success is red.
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [[ -n "$bad" ]]; then
            echo "::error title=CI gate::not green: $bad"
            exit 1
          fi
